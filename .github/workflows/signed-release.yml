# Replaces the unsigned macOS assets on a release with signed, notarized ones.
#
# Runs after the Release workflow (which builds unsigned artifacts) finishes for a v* tag, or by hand
# for an existing tag. This is a separate workflow so release.yml stays identical to upstream's and
# upstream syncs don't conflict with it. Setup: docs/WKU-SIGNED-RELEASES.md.

name: Signed Release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to sign (for example v2026.11.06.1500)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: signed-release-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  sign:
    name: Sign, notarize and upload
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.event == 'push'
              && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: macos-26
    # Holds the signing secrets. Give it required reviewers and limit it to the main branch.
    environment: release-signing
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          TAG="${INPUT_TAG:-$RUN_TAG}"
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::'$TAG' is not a release tag like v2026.11.06.1500"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Only sign code that is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${{ steps.tag.outputs.tag }} is not on main; refusing to sign it."
            exit 1
          fi

      - name: Select Xcode 26 (same as release.yml)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.app
          swift --version

      - name: Import signing certificates and notary credentials
        env:
          APP_P12: ${{ secrets.APPLE_APP_CERT_P12_BASE64 }}
          APP_P12_PASSWORD: ${{ secrets.APPLE_APP_CERT_P12_PASSWORD }}
          PKG_P12: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          PKG_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          for v in APP_P12 APP_P12_PASSWORD PKG_P12 PKG_P12_PASSWORD NOTARY_APPLE_ID NOTARY_PASSWORD NOTARY_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is not set in the release-signing environment"; exit 1; fi
          done
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$PKG_P12" | base64 --decode > "$RUNNER_TEMP/pkg.p12"
          security import "$RUNNER_TEMP/app.p12" -P "$APP_P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/pkg.p12" -P "$PKG_P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/pkgbuild -T /usr/bin/productsign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/pkg.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Also validates the Apple ID credentials now, before a long build.
          xcrun notarytool store-credentials "asbmutil-ci" --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID" --keychain "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v "$KEYCHAIN"

      - name: Build, sign and notarize
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          NOTARY_PROFILE: asbmutil-ci
        run: bash tools/ci-sign-release.sh

      - name: Replace the unsigned assets on the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null   # fails clearly if the Release workflow didn't create it
          gh release upload "$TAG" dist/signed/* --clobber
          body="$(gh release view "$TAG" --json body --jq .body)"
          if ! grep -q 'Developer ID and notarized' <<<"$body"; then
            gh release edit "$TAG" --notes "$(printf '%s\n\n---\nmacOS .pkg, .dmg and CLI zip are signed with Developer ID and notarized by Apple.' "$body")"
          fi

      - name: Remove the temporary keychain
        if: ${{ always() }}
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP"/app.p12 "$RUNNER_TEMP"/pkg.p12
